name: 桃園商業區土地獵人｜新目標通知

on:
  schedule:
    # Taiwan time 08:17 (UTC+8); scheduled Actions may be delayed.
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: commercial-radar-notifications
  cancel-in-progress: false

jobs:
  notify:
    name: 檢查已驗證新目標（無新目標不發通知）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send GitHub Issues only for approved new targets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/notify_verified_targets.py
