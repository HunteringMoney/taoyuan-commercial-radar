name: 桃園商業區土地獵人｜新目標通知

on:
  push:
    paths:
      - 'scripts/probe_official_gis.py'
      - 'scripts/integration_scoring.py'
      - 'scripts/pilot_zoning_codes.py'
      - 'scripts/validate_official_commercial_boundary.py'
      - 'scripts/test_boundary.py'
      - 'scripts/discover_official_map.py'
      - '.github/workflows/notify-verified-targets.yml'
  schedule:
    # Taiwan time 09:00 (UTC+8); scheduled Actions may be delayed.
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: commercial-radar-notifications
  cancel-in-progress: false

jobs:
  notify:
    name: 檢查已驗證新目標（無新目標不發通知）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geometry test dependency
        run: python -m pip install 'shapely>=2,<3'
      - name: Test official commercial boundary safety gates
        run: cd scripts && python -m unittest test_boundary.py -v
      - name: Validate integration scoring rules
        run: python scripts/integration_scoring.py
      - name: Discover official GIS schema (never publish unverified targets)
        run: python scripts/probe_official_gis.py
      - name: Upload GIS diagnostic for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-gis-diagnostic
          path: ${{ runner.temp }}/taoyuan-official-gis-diagnostic.json
          if-no-files-found: warn
          retention-days: 14
      - name: Pilot municipal zoning codes in Taoyuan old town
        run: python scripts/pilot_zoning_codes.py
      - name: Upload zoning pilot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-zoning-pilot
          path: ${{ runner.temp }}/commercial-zoning-pilot.json
          if-no-files-found: warn
          retention-days: 14
      - name: Discover municipal official zoning map service endpoints
        run: python scripts/discover_official_map.py
      - name: Upload municipal map discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: municipal-official-map-discovery
          path: ${{ runner.temp }}/urban-map-endpoints.json
          if-no-files-found: warn
          retention-days: 14
      - name: Send GitHub Issues only for approved new targets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/notify_verified_targets.py
